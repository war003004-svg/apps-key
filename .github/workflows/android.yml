name: Build EvoType Keyboard APK

on:
  workflow_dispatch:
  push:
    paths:
      - "EvoTypeKeyboard-Android-Updated.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project ZIP
        run: |
          mkdir source
          unzip -q EvoTypeKeyboard-Android-Updated.zip -d source

      - name: Build Android APK
        run: |
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle.kts -print -quit)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EvoType-Keyboard-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
